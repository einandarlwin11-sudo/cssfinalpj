<!DOCTYPE html>
<html>
    <head>
        <style>
            table,th,td{
                border: 1px solid black;
               
            }
        </style>
        
    </head>
<body>
    <h2>Lesson Preview:HTML Tables</h2>
   
    <p>
        Use rows and cells to organize tabular information.
        <table>
            <tr>
                <th>Element</th>
                <th>Purpose</th>
            </tr>
            <tr>
                <td>tr</td>
                <td>Table row</td>
            </tr>
            <tr>
                <td>td</td>
                <td>Table data cell</td>
            </tr>
        </table>
    </p>
</body>
</html>
